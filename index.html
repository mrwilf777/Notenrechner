.g{font-weight:600}

.thr td,.thr th{text-align:center}
h2{font-size:15px;margin:0 0 10px}
.listwrap{max-height:70vh;overflow:auto}

.students .nm input{width:180px;text-align:left}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:6px}

.stat span{font-size:12px;color:var(--muted)}

// Skalierung für halbe/Viertelpunkte (laut Hinweisblatt: BE und BE-Gesamt mit 2 bzw. 4 multiplizieren)
function factorFor(vals){
  for (const f of [1,2,4]) if (vals.every(v => Math.abs(v*f - Math.round(v*f)) < 1e-9)) return f;
  return null;
}
function grade(kind, total, pts, f){
  const T = Math.round(total*f), P = Math.round(pts*f);
  if (T < 6 || T > 150 || P < 0 || P > T) return null;
  return DATA[kind][T-6][P] / 10;
}
const fmt = g => g.toFixed(1).replace('.', ',');
const fmtP = p => String(p).replace('.', ',');
const cls = g => 'g n' + Math.min(6, Math.max(1, Math.round(g)));
const num = s => { s = String(s).trim().replace(',', '.'); return s === '' ? NaN : Number(s); };

function kinds(){
  const st = +$('#stufe').value;
  if (st <= 6) return ['OS'];
  const z = $('#zug').value;
  return z === 'both' ? ['OS','GYM'] : [z];
}
function checkTotal(){
  const t = num($('#total').value);
  if (isNaN(t)) return {err:'Bitte die Gesamtpunktzahl eingeben.'};
  const f = factorFor([t]);
  if (!f) return {err:'Nur ganze, halbe oder Viertelpunkte möglich.'};
  if (t*f < 6) return {err:'Die Notentabelle beginnt bei 6 Punkten.'};
  if (t > 150) return {err:'Die Notentabelle reicht nur bis 150 Punkte.'};
  return {t, f};
}

function renderListe(){
  const c = checkTotal(), K = kinds();
  $('#thr').innerHTML = ''; $('#list').innerHTML = '';
  if (c.err) return;
  const {t, f} = c;
  // halbe Punkte in der Liste anbieten, wenn das Doppelte noch in die Tabelle passt
  const rows = [];
  for (let k = Math.round(t*f); k >= 0; k--) rows.push(k/f);

  // Schwellen: kleinste Punktzahl, mit der Note <= n,0 erreicht wird
  let h = '<table class="thr"><tr><th>Note</th>' + [1,2,3,4,5].map(n => '<th>' + n + ',0 oder besser</th>').join('') + '</tr>';
  for (const kind of K){
    h += '<tr><th>' + LBL[kind] + '</th>';
    for (const n of [1,2,3,4,5]){
      let min = null;
      for (const p of rows) if (grade(kind,t,p,f) <= n) min = p;
      h += '<td>' + (min === null ? '–' : 'ab ' + fmtP(min) + ' P.') + '</td>';
    }
    h += '</tr>';
  }
  $('#thr').innerHTML = h + '</table>';

  let L = '<table><thead><tr><th>Punkte</th><th>Prozent</th>' + K.map(k => '<th>Note ' + LBL[k] + '</th>').join('') + '</tr></thead><tbody>';
  for (const p of rows){
    L += '<tr><td class="p">' + fmtP(p) + '</td><td class="pct">' + Math.round(p/t*100) + ' %</td>' +
      K.map(k => { const g = grade(k,t,p,f); return '<td class="' + cls(g) + '">' + fmt(g) + '</td>'; }).join('') + '</tr>';
  }
  $('#list').innerHTML = L + '</tbody></table>';
  $('#thrTitle').textContent = 'Mindestpunktzahl je Note · ' + fmtP(t) + ' Punkte';
}

let students = store.get('students', [{n:'',p:''}]);
function renderKlasse(focusIdx){
  const K = kinds(), c = checkTotal();
  let h = '<tr><th style="text-align:left">#</th><th style="text-align:left">Name (optional)</th><th>Punkte</th>' + K.map(k => '<th>Note ' + LBL[k] + '</th>').join('') + '<th class="noprint"></th></tr>';
  const sums = Object.fromEntries(K.map(k => [k, []]));
  students.forEach((s, i) => {
    const p = num(s.p);
    let cells = K.map(() => '<td></td>').join('');
    if (!c.err && !isNaN(p)){
      const f = factorFor([c.t, p]);
      if (!f || c.t*f > 150) cells = '<td colspan="' + K.length + '" class="err" style="text-align:right">Teilpunkte nicht umrechenbar</td>';
      else if (p < 0 || p > c.t) cells = '<td colspan="' + K.length + '" class="err" style="text-align:right">außerhalb 0–' + fmtP(c.t) + '</td>';
      else cells = K.map(k => { const g = grade(k, c.t, p, f); sums[k].push(g); return '<td class="' + cls(g) + '">' + fmt(g) + '</td>'; }).join('');
    }
    h += '<tr><td style="text-align:left;color:var(--muted)">' + (i+1) + '</td>' +
      '<td class="nm"><input data-i="' + i + '" data-f="n" value="' + (s.n||'').replace(/"/g,'&quot;') + '"></td>' +
      '<td><input data-i="' + i + '" data-f="p" inputmode="decimal" value="' + (s.p||'') + '"></td>' + cells +
      '<td class="noprint"><button class="del" data-del="' + i + '" title="Zeile entfernen">×</button></td></tr>';

  $('#stud').innerHTML = h;
  if (focusIdx !== undefined){ const el = document.querySelector('input[data-i="' + focusIdx + '"][data-f="p"]'); if (el) el.focus(); }

  let S = '<h2>Auswertung</h2>';
  for (const k of K){
    const a = sums[k];
    if (!a.length){ S += '<p class="hint">' + LBL[k] + ': noch keine Punkte eingetragen.</p>'; continue; }
    const avg = a.reduce((x,y) => x+y, 0) / a.length;
    // Notenspiegel nach gerundeter ganzer Note (x,5 und besser zur besseren Note)
    const sp2 = [0,0,0,0,0,0]; a.forEach(g => { let n = g <= 1.5 ? 1 : Math.ceil(g - 0.5); sp2[Math.min(6,n)-1]++; });
    S += '<div style="margin-bottom:12px"><b>' + LBL[k] + '</b><div class="stats">' +
      '<div class="stat"><b>' + avg.toFixed(2).replace('.', ',') + '</b><span>Durchschnitt (' + a.length + ' Arbeiten)</span></div>' +
      sp2.map((v, i) => '<div class="stat"><b class="n' + (i+1) + '">' + v + '</b><span>Note ' + (i+1) + '</span></div>').join('') +
      '</div></div>';
  }
  S += '<p class="hint">Notenspiegel: x,5 zählt zur besseren Note.</p>';
  $('#statsCard').innerHTML = S;
}

function render(focusIdx){
  const c = checkTotal();
  $('#msg').innerHTML = c.err && $('#total').value !== '' ? '<p class="err">' + c.err + '</p>' : '';
  const st = +$('#stufe').value;
  $('#zugWrap').style.display = (st <= 6 || view === 'schnell') ? 'none' : '';
  $('#stufeWrap').style.display = view === 'schnell' ? 'none' : '';
  store.set('total', $('#total').value); store.set('stufe', $('#stufe').value); store.set('zug', $('#zug').value);
  if (view === 'liste') renderListe(); else if (view === 'schnell') renderSchnell(); else renderKlasse(focusIdx);
}

let qKind = store.get('qKind', 'OS');
function renderSchnell(){
  document.querySelectorAll('#qKind button').forEach(b => b.classList.toggle('on', b.dataset.k === qKind));
  const c = checkTotal(), p = num($('#qPts').value), out = $('#qOut');
  if (c.err || isNaN(p)) { out.innerHTML = '<p class="hint">' + (c.err || 'Erreichte Punkte eingeben.') + '</p>'; return; }
  const f = factorFor([c.t, p]);
  if (!f || c.t*f > 150) { out.innerHTML = '<p class="err">Diese Teilpunkte lassen sich mit der Tabelle nicht umrechnen.</p>'; return; }
  if (p < 0 || p > c.t) { out.innerHTML = '<p class="err">Punkte müssen zwischen 0 und ' + fmtP(c.t) + ' liegen.</p>'; return; }
  const g = grade(qKind, c.t, p, f);
  out.innerHTML = '<div class="big ' + cls(g) + '">' + fmt(g) + '</div>' +
    '<p class="hint" style="margin-top:4px">' + fmtP(p) + ' von ' + fmtP(c.t) + ' Punkten (' + Math.round(p/c.t*100) + ' %) · Tabelle ' + LBL[qKind] + '</p>';
}
$('#qPts').addEventListener('input', renderSchnell);
document.querySelectorAll('#qKind button').forEach(b => b.onclick = () => { qKind = b.dataset.k; store.set('qKind', qKind); renderSchnell(); $('#qPts').focus(); });

let view = store.get('view', 'liste');
function setView(v){
  view = v; store.set('view', v);
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $('#v-liste').classList.toggle('hidden', v !== 'liste');
  $('#v-klasse').classList.toggle('hidden', v !== 'klasse');
  $('#v-schnell').classList.toggle('hidden', v !== 'schnell');
  render();
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setView(b.dataset.view));

$('#total').value = store.get('total', '');
$('#stufe').value = store.get('stufe', '7');
$('#zug').value = store.get('zug', 'both');
['#total','#stufe','#zug'].forEach(s => $(s).addEventListener('input', () => render()));

// Klassenliste: Eingaben ohne Neuaufbau beim Tippen in Namen; Noten bei Punkten aktualisieren
$('#stud').addEventListener('input', e => {
  const i = e.target.dataset.i, f = e.target.dataset.f; if (i === undefined) return;
  students[i][f] = e.target.value; store.set('students', students);
  if (f === 'p') renderKlasse(+i);
});
$('#stud').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.dataset.i === undefined) return;
  e.preventDefault();
  const i = +e.target.dataset.i;
  students[i][e.target.dataset.f] = e.target.value;
  if (i === students.length - 1) students.push({n:'', p:''});
  store.set('students', students);
  renderKlasse(i + 1);
});
$('#stud').addEventListener('click', e => {
  const d = e.target.dataset.del; if (d === undefined) return;
  students.splice(+d, 1); if (!students.length) students.push({n:'', p:''});
  store.set('students', students); renderKlasse();
});
$('#add').onclick = () => { students.push({n:'', p:''}); store.set('students', students); renderKlasse(students.length - 1); };
$('#clear').onclick = () => { if (confirm('Alle Einträge der Klassenliste löschen?')) { students = [{n:'', p:''}]; store.set('students', students); renderKlasse(0); } };

setView(view);
</script>
</body>
</html>
